[package]
name = "vineland-spp-asp-admitter"
version = "0.1.0"
edition = "2021"
authors = ["Manuel Galmanus <manuel@bluewaveai.online>"]
description = "KYC-gated, unlinkable admission into a Stellar Private Payments (SPP) Association Set. Becomes the admin of Nethermind's asp-membership tree and inserts a pool key only after a hash-based STARK proof that the requester belongs to the issuer's KYC'd set; the proof never reveals which member. Single-use per member commitment."
license = "MIT"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.2"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
